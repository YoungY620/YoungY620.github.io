      <div data-page="sections"><section class="log-section"><h2>把个人主页变成空间</h2><p>信息架构不一定是导航栏。码头承载外链，图书馆承载长内容，海滩承载兴趣，洞穴承载独立游戏；空间关系让链接获得记忆点。</p></section><section class="log-section"><h2>纯静态也可以有状态</h2><p>GitHub Pages 没有后端，但浏览器仍能保存位置、音乐偏好和地牢进度。关键是把可移植的本地状态与内容发布解耦。</p></section></div>
